# Summarizer: Flan-T5-base
model_name: google/flan-t5-base
seed: 42
source_prefix: "Summarize this consent clause in plain language: "
max_source_length: 512
max_target_length: 128
learning_rate: 1.0e-4
num_train_epochs: 20
per_device_train_batch_size: 8
num_beams: 4
no_repeat_ngram_size: 3
output_dir: artifacts_out/summ/flant5base
